security:
    providers:
        chain_provider:
            chain:
                providers: [pim_user]
        pim_user:
            id: pim_user.provider.user
        pim_user_api:
            id: pim_user.provider.user_api

    encoders:
        Akeneo\UserManagement\Component\Model\User: sha512
        Symfony\Component\Security\Core\User\User: plaintext
    enable_authenticator_manager:   true
    firewalls:
        dev:
            pattern:                        ^/(_(profiler|wdt)|css|images|js)/
            security:                       false

        install:
            pattern:                        ^/installer
            security:                       false
            anonymous:                      true

        login:
            pattern:                        ^/user/(login|reset-request|send-email|check-email)$
            provider:                       chain_provider

        reset_password:
            pattern:                        ^/user/reset/*
            provider:                       chain_provider

        oauth_token:
            pattern:                        ^/api/oauth/v1/token
            security:                       false

        oauth2_token:
            pattern:                        ^/connect/apps/v1/oauth2/token
            security:                       false

        openid_public_key:
            pattern:                        ^/connect/apps/v1/openid/public-key
            security:                       false

        api_index:
            pattern:                        ^/api/rest/v1$
            security:                       false

        api:
            pattern:                        ^/api
            fos_oauth:                      false
            stateless:                      true
            access_denied_handler:          pim_api.security.access_denied_handler
            provider:                       pim_user_api

        main:
            pattern:                        ^/
            provider:                       chain_provider
            custom_authenticators:
                - pcmt_open_id.security.open_id_authenticator
            logout:
                path:                       pim_user_security_logout
            anonymous:                      false
    access_control:
        - { path: ^/admin/, role: ROLE_ADMIN }
        - { path: ^/api/rest/v1$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api/, role: pim_api_overall_access }
        - { path: ^/openid/callback, role: IS_AUTHENTICATED_ANONYMOUSLY }

acl:
    connection: default
    cache:
        id: security.acl.cache.doctrine
        prefix: sf2_acl_
