---
- hosts: all
  gather_facts: false
  become: yes
  
  vars:
    pip_install_packages:
      - name: docker
      - name: pyrsistent
        version: ">0.15,<0.16"
      # - name: docker-compose
    docker_version_env: "{{ lookup('env','DOCKER_VERSION') | default('', true) }}"
    docker_version_map:
      bionic: ""
      focal:  "5:27.0.3-1~ubuntu.20.04~focal"
      jammy:  "5:27.0.3-1~ubuntu.22.04~jammy"

    docker_version: >-
      {{ docker_version_env if docker_version_env|length > 0
         else (docker_version_map[ansible_distribution_release] | default('')) }}
    docker_install_compose: true
    docker_compose_version: "{{ lookup('env', 'DOCKER_COMPOSE_VERSION')}}"
    docker_compose_path: /usr/local/bin/docker-compose
    docker_compose_package_state: present
    docker_packages:
      - "{{ docker_version|length > 0 | ternary('docker-ce=' ~ docker_version, 'docker-ce') }}"
      - "{{ docker_version|length > 0 | ternary('docker-ce-cli=' ~ docker_version, 'docker-ce-cli') }}"
      - "{{ docker_version|length > 0 | ternary('docker-ce-rootless-extras=' ~ docker_version, 'docker-ce-rootless-extras') }}"
    docker_packages_state: present
    docker_profiles: "{{ lookup('env', 'DOCKER_PROFILES') | default('azure-profile') }}"

    pcmt_asset_url: "{{ lookup('env', 'PCMT_ASSET_URL') }}"
    pcmt_profile: "{{ lookup('env', 'PCMT_PROFILE') }}"
    pcmt_ver: "{{ lookup('env', 'PCMT_VER') }}"
    pcmt_secret_conf: "{{ lookup('env', 'PCMT_SECRET_CONF') }}"
    pcmt_traefik_conf: "{{ lookup('env', 'PCMT_TRAEFIK_CONF') }}"
    pcmt_azure_storage_account_container_name: "{{pcmt_hostname | replace('.', '-')}}"
    pcmt_azure_storage_key: "{{ lookup('env', 'AZURE_STORAGE_KEY') }}"
    pcmt_azure_storage_account: "{{ lookup('env', 'AZURE_STORAGE_ACCOUNT') }}"
    sso_enable: "{{ lookup('env', 'SSO_ENABLE') }}"

  environment:
    PCMT_PROFILE: "{{ pcmt_profile }}"
    PCMT_VER: "{{ pcmt_ver }}"
    PCMT_SECRET_CONF: "{{ pcmt_secret_conf }}"
    PCMT_TRAEFIK_CONF: "{{ pcmt_traefik_conf }}"
    PCMT_HOSTNAME: "{{ pcmt_hostname }}"
    PCMT_S3_BUCKET: "s3://{{ pcmt_hostname }}"
    PCMT_AZURE_STORAGE_CONTAINER_NAME: "{{ pcmt_azure_storage_account_container_name }}"
    PCMT_AZURE_STORAGE_ACCOUNT: "{{ pcmt_azure_storage_account }}"
    PCMT_AZURE_STORAGE_KEY: "{{ pcmt_azure_storage_key }}"
    COMPOSE_HTTP_TIMEOUT: "300"
    DOCKER_CLIENT_TIMEOUT: "300"
    SSO_ENABLE: "{{ sso_enable }}"
  
  pre_tasks:
    - include_tasks: tasks/python2-ubuntu.yml
    - setup:

    # Clean any docker.com repos
    - name: Remove Docker repo lines from /etc/apt/sources.list
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: '^deb\s+.*download\.docker\.com/linux/ubuntu'
        state: absent

    - name: Remove docker.com lines from .list files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "*.list"
        file_type: file
      register: apt_list_files

    - name: Strip docker.com lines from .list files
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: '^deb\s+.*download\.docker\.com/linux/ubuntu'
        state: absent
      loop: "{{ apt_list_files.files }}"

    # 👉 On bionic, use distro package and do NOT add docker repo
    - name: Switch to distro docker.io on bionic
      ansible.builtin.set_fact:
        docker_add_repo: false
        docker_packages:
          - docker.io
        docker_packages_state: present
        # neutralize any version pins the role might apply
        docker_version: null
      when: ansible_distribution_release == 'bionic'

    # Only add Docker’s official repo on non-bionic hosts
    - name: Ensure apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_distribution_release != 'bionic'

    - name: Install Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: ansible_distribution_release != 'bionic'

    - name: Configure Docker apt repository
      ansible.builtin.apt_repository:
        filename: docker
        repo: >-
          deb [arch={{ (ansible_architecture == 'x86_64') | ternary('amd64', ansible_architecture) }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        update_cache: yes
      when: ansible_distribution_release != 'bionic'

    - name: apt update
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
  roles:
    - role: geerlingguy.pip
    - role: geerlingguy.docker
  
  tasks:
    - include_tasks: tasks/swapfile.yml
    - include_tasks: tasks/pim.yml
    - include_tasks: tasks/ssh-mysql-ro.yml
    