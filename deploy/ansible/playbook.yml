---
- hosts: all
  gather_facts: false
  become: yes
  
  vars:
    pip_install_packages:
      - name: docker
      - name: pyrsistent
        version: ">0.15,<0.16"
      # - name: docker-compose
    docker_version: "{{ lookup('env', 'DOCKER_VERSION') }}"
    docker_install_compose: true
    docker_compose_version: "{{ lookup('env', 'DOCKER_COMPOSE_VERSION')}}"
    docker_compose_path: /usr/local/bin/docker-compose
    docker_compose_package_state: present
    docker_packages:
      - "docker-ce={{docker_version}}"
      - "docker-ce-cli={{docker_version}}"
      - "docker-ce-rootless-extras={{docker_version}}"
    docker_packages_state: present
    docker_profiles: "{{ lookup('env', 'DOCKER_PROFILES') | default('azure-profile') }}"

    pcmt_asset_url: "{{ lookup('env', 'PCMT_ASSET_URL') }}"
    pcmt_profile: "{{ lookup('env', 'PCMT_PROFILE') }}"
    pcmt_ver: "{{ lookup('env', 'PCMT_VER') }}"
    pcmt_secret_conf: "{{ lookup('env', 'PCMT_SECRET_CONF') }}"
    pcmt_traefik_conf: "{{ lookup('env', 'PCMT_TRAEFIK_CONF') }}"
    pcmt_azure_storage_account_container_name: "{{pcmt_hostname | replace('.', '-')}}"
    pcmt_azure_storage_key: "{{ lookup('env', 'AZURE_STORAGE_KEY') }}"
    pcmt_azure_storage_account: "{{ lookup('env', 'AZURE_STORAGE_ACCOUNT') }}"
    sso_enable: "{{ lookup('env', 'SSO_ENABLE') }}"

  environment:
    PCMT_PROFILE: "{{ pcmt_profile }}"
    PCMT_VER: "{{ pcmt_ver }}"
    PCMT_SECRET_CONF: "{{ pcmt_secret_conf }}"
    PCMT_TRAEFIK_CONF: "{{ pcmt_traefik_conf }}"
    PCMT_HOSTNAME: "{{ pcmt_hostname }}"
    PCMT_S3_BUCKET: "s3://{{ pcmt_hostname }}"
    PCMT_AZURE_STORAGE_CONTAINER_NAME: "{{ pcmt_azure_storage_account_container_name }}"
    PCMT_AZURE_STORAGE_ACCOUNT: "{{ pcmt_azure_storage_account }}"
    PCMT_AZURE_STORAGE_KEY: "{{ pcmt_azure_storage_key }}"
    COMPOSE_HTTP_TIMEOUT: "300"
    DOCKER_CLIENT_TIMEOUT: "300"
    SSO_ENABLE: "{{ sso_enable }}"
  
  pre_tasks:
    - include_tasks: tasks/python2-ubuntu.yml
    - setup:
  roles:
    - role: geerlingguy.pip
    - role: geerlingguy.docker
  
  tasks:
    - include_tasks: tasks/swapfile.yml
    - include_tasks: tasks/pim.yml
    - include_tasks: tasks/ssh-mysql-ro.yml
    