default:
    suites:
        default:
            contexts:
                - FeatureContext:
                    kernel: '@kernel'
    extensions:
        Behat\MinkExtension:
            default_session: symfony
            browser_name: 'chrome'
            base_url: 'https://smart-test.productcatalog.io/'
            javascript_session: selenium2
            sessions:
                symfony:
                    symfony: ~
                selenium2:
                    selenium2:
                        wd_host: 'http://selenium:4444/wd/hub'
                        capabilities:
                            browserName: "chrome"
                            version: ""
                            platform: "ANY"
                            chrome:
                                switches:
                                    - "--window-size=1280,1024"
                                    - "--start-maximized"
                                    - "--no-sandbox"
                                    - "--headless"
                                prefs:
                                    foo: "Just because prefs must be a dictionary"
        FriendsOfBehat\SymfonyExtension:
            bootstrap: config/bootstrap.php
            kernel:
                path: src/Kernel.php
                class: Kernel
                environment: behat
                debug: false
