stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  # see https://yarnpkg.com/lang/en/docs/cli/cache/
  HOST_YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/cache/yarn"
  # see https://on.cypress.io/caching
  HOST_CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/cache/Cypress"
  HOST_COMPOSER_HOME: "$CI_PROJECT_DIR/.cache/composer"

# cache using branch name
# https://gitlab.com/help/ci/caching/index.md
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - cache/yarn
    - cache/Cypress

default:
  image:
    name: docker/compose:1.29.2
    entrypoint: ["/bin/sh", "-c"]
  services:
    - docker:dind
  before_script:
    - docker info
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASS
    - apk add bash make git curl libxml2-utils bc
    - bash --version
  ############### PCMT VERSIONS (for deploy) ###############


.pcmt_v_3_0_0:
  variables:
    PCMT_VER: '3.0.0-snapshot'
    PCMT_ASSET_URL: 'https://gitlab.com/pcmt/pcmt-akeneov6/-/archive/master/pcmt-akeneov6-master.tar.gz'

############### PIM ###############

.pim_only_changes:
  only:
    changes:
      - '.gitlab-ci.yml'
      - 'src/**/*'
      - '.pcmt.env'
      - 'config/**/*'
      - 'conf/**/*'
      - 'scripts/**/*'
      - 'upgrades/**/*'
      - 'docker-compose.yml'
      - 'docker-compose.tls.yml'
      - 'docker-compose.prod.yml'
      - 'Dockerfile'
      - 'Makefile'
      - 'package.json'
      - 'tsconfig.json'
      - 'yarn.lock'
.pim_docker_build:
  stage: build
  script:
    - scripts/ci-build.sh
    - scripts/ci-push.sh

pim docker build (on git push):
  extends:
    - .pim_docker_build
    - .pim_only_changes

pim docker build (manual retry):
  extends: .pim_docker_build
  when: manual

############### IoC ###############

ansible docker build:
  stage: build
  only:
    refs:
      - master@pcmt/pcmt-akeneov6
    changes:
      - deploy/ansible/**/*
  except:
    variables:
      - $CI_SELENIUM == "true"
  script:
    - make ansible
    - docker push pcmt/ansible:forv6

terraform docker build:
  stage: build
  only:
    refs:
      - master@pcmt/pcmt-akeneov6
    changes:
      - deploy/terraform/Dockerfile
      - deploy/terraform/script/**/*
      - deploy/terraform/env/**/*
  except:
    variables:
      - $CI_SELENIUM == "true"
  script:
    - make terraform
    - docker push pcmt/terraform:v6

cron docker build:
  stage: build
  only:
    refs:
      - master@pcmt/pcmt-akeneov6
    changes:
      - deploy/cron/**/*
  except:
    changes:
      - deploy/mysql-backup/**/*
  script:
    - make cron
    - docker push pcmt/cron:3.0.0-snapshot

