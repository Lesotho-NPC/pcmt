################ Test #######################

unit-test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    - sleep 60
    - echo "Code coverage is 90%"

lint-test-job:   # This job also runs in the test stage.
  stage: test    # It can run at the same time as unit-test-job (in parallel).
  script:
    - echo "Linting code... This will take about 10 seconds."
    - sleep 10
    - echo "No lint issues found."

############### test-ansible.productcatalog.io Environment ###############

.env-test-ansible-pc-io:
  extends:
    - .pcmt_v_3_0_0
  stage: deploy
  only:
    - master@pcmt/pcmt-akeneov6
  when: manual
  needs: []
  variables:
    PCMT_PROFILE: prod
  except:
    variables:
      - $CI_SELENIUM == "true"
  environment:
    name: test-ansible-pc-io
    url: http://test-ansible.productcatalog.io
    on_stop: env-test-ansible-pc-io-destroy

.env-test-ansible-pc-io_script-deploy:
  script:
    - source .ci-productcatalog-io.env
    - ./scripts/ci-deploy.sh test-ansible-pc-io

.env-test-ansible-pc-io_script-destroy:
  script:
    - ./deploy/terraform/run-docker.sh test-ansible-pc-io destroy -auto-approve

env-test-ansible-pc-io:
  extends:
    - .env-test-ansible-pc-io
    - .env-test-ansible-pc-io_script-deploy

env-test-ansible-pc-io-destroy:
  extends:
    - .env-test-ansible-pc-io
    - .env-test-ansible-pc-io_script-destroy
  when: manual
  environment:
    name: test-ansible-pc-io
    action: stop
