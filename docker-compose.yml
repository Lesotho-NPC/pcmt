version: '3.7'

services:
  php:
    image: 'pcmt/php:${PCMT_VER:-3.0.0-snapshot}'
    build:
      context: .
      target: php
    environment:
      APP_ENV: '${APP_ENV:-prod}'
      COMPOSER_HOME: '/var/www/.composer'
      PHP_IDE_CONFIG: 'serverName=pim-docker-cli'
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: 'client_host=172.17.0.1'
      BLACKFIRE_CLIENT_ID: '${BLACKFIRE_CLIENT_ID:-client_id}'
      BLACKFIRE_CLIENT_TOKEN: '${BLACKFIRE_CLIENT_TOKEN:-client_token}'
    volumes:
      - '${HOST_COMPOSER_HOME:-~/.composer}:/var/www/.composer'
    init: true
    networks:
      - 'pim'

  node:
    image: 'akeneo/node:14'
    build:
      context: .
      target: node
    environment:
      YARN_CACHE_FOLDER: '/home/node/.yarn'
      CYPRESS_CACHE_FOLDER: '/home/node/.cypress'
    volumes:
      - '${HOST_YARN_CACHE_FOLDER:-~/.cache/yarn}:/home/node/.yarn'
      - '${HOST_CYPRESS_CACHE_FOLDER:-~/.cache/Cypress}:/home/node/.cypress'
    networks:
      - 'pim'

  fpm:
    image: 'pcmt/fpm:${PCMT_VER:-3.0.0-snapshot}'
    restart: unless-stopped
    build:
      context: .
      target: fpm
    env_file:
      - .env
      - .pcmt.env
    environment:
      APP_ENV: '${APP_ENV:-prod}'
      BEHAT_TMPDIR: '/srv/pim/var/cache/tmp'
      BEHAT_SCREENSHOT_PATH: '/srv/pim/var/tests/screenshots'
      PHP_IDE_CONFIG: 'serverName=pim-docker-web'
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: 'client_host=172.17.0.1'
      BLACKFIRE_CLIENT_ID: '${BLACKFIRE_CLIENT_ID:-client_id}'
      BLACKFIRE_CLIENT_TOKEN: '${BLACKFIRE_CLIENT_TOKEN:-client_token}'
    volumes:
      - type: volume
        source: pim
        target: '/srv/pim'
    working_dir: '/srv/pim'
    networks:
      - 'pim'

  selenium:
    image: 'selenium/standalone-chrome-debug:3.141.59'
    volumes:
      - '/dev/shm:/dev/shm'
      - 'pim:/srv/pim:ro'
    ports:
      - '${DOCKER_PORT_SELENIUM:-5910}:5900'
    networks:
      - 'pim'

  httpd:
    image: 'pcmt/httpd:${PCMT_VER:-3.0.0-snapshot}'
    build:
      context: .
      target: httpd
    restart: unless-stopped
    environment:
      APP_ENV: '${APP_ENV:-prod}'
    depends_on:
      - 'fpm'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.http.rule=PathPrefix(`/`)"
    volumes:
      - type: volume
        source: pim
        target: '/srv/pim'
        read_only: true
    networks:
      - 'pim'

  mysql:
    image: 'mysql:8.0.26'
    restart: unless-stopped
    command: '--default-authentication-plugin=mysql_native_password'
    environment:
      MYSQL_ROOT_PASSWORD_FILE: '/run/secrets/mysql-root-password'
      MYSQL_USER_FILE: '/run/secrets/mysql-username'
      MYSQL_DATABASE: '${APP_DATABASE_NAME}'
      MYSQL_PASSWORD_FILE: '/run/secrets/mysql-password'
    volumes:
      - './docker/initdb.d:/docker-entrypoint-initdb.d:ro'
      - 'mysqldata:/var/lib/mysql'
    ports:
      - '${DOCKER_PORT_MYSQL:-33006}:3306'
    secrets:
      - mysql-root-password
      - mysql-username
      - mysql-password
    networks:
      - 'pim'

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.16.2'
    restart: unless-stopped
    environment:
      ES_JAVA_OPTS: '${ES_JAVA_OPTS:--Xms512m -Xmx512m}'
      discovery.type: 'single-node'
    volumes:
      - 'esdata:/usr/share/elasticsearch/data'
    ports:
      - '${DOCKER_PORT_ELASTICSEARCH:-9210}:9200'
    networks:
      - 'pim'

  object-storage:
    image: 'minio/minio:RELEASE.2021-09-15T04-54-25Z'
    restart: unless-stopped
    entrypoint: '/bin/sh -c "mkdir -p /data/archive /data/catalog /data/jobs && minio server /data"'
    environment:
      MINIO_ACCESS_KEY: 'AKENEO_OBJECT_STORAGE_ACCESS_KEY'
      MINIO_SECRET_KEY: 'AKENEO_OBJECT_STORAGE_SECRET_KEY'
    ports:
      - '${DOCKER_PORT_OBJECT_STORAGE:-9090}:9000'
    networks:
      - 'pim'

  blackfire:
    image: 'blackfire/blackfire:2'
    restart: unless-stopped
    environment:
      BLACKFIRE_SERVER_ID: '${BLACKFIRE_SERVER_ID:-server_id}'
      BLACKFIRE_SERVER_TOKEN: '${BLACKFIRE_SERVER_TOKEN:-server_token}'
    networks:
      - 'pim'

  pubsub-emulator:
    image: 'google/cloud-sdk:331.0.0'
    command: 'gcloud --user-output-enabled --log-http beta emulators pubsub start --host-port=0.0.0.0:8085'
    networks:
      - 'pim'

  reverse-proxy:
    image: traefik:${TRAEFIK_TAG:-v3.0}
    restart: unless-stopped
    env_file:
      - .env
      - .pcmt.env
    ports:
      - "${DOCKER_PORT_HTTP:-8080}:80"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ${PCMT_TRAEFIK_CONF:-./conf/traefik.toml.dist}
        target: /etc/traefik/traefik.toml
        read_only: true
    networks:
      - 'pim'

volumes:
  mysqldata:
    driver: local
  esdata:
    driver: local
  pim:
    driver: local

secrets:
  mysql-root-password:
    file: "${PCMT_MYSQL_ROOT_PASSWORD_CONF:-./conf/mysql-root-password.dist}"
  mysql-username:
    file: "${PCMT_MYSQL_USERNAME_CONF:-./conf/mysql-username.dist}"
  mysql-password:
    file: "${PCMT_MYSQL_PASSWORD_CONF:-./conf/mysql-password.dist}"

networks:
  pim:
